[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "movielens-recommender"
version = "1.0.0"
description = "Temporal collaborative filtering with regularized matrix factorization, full-catalog ranking, and popularity baselines."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{name = "Djordje Kartaljevic"}]
dependencies = ["numpy==2.4.4", "pandas==3.1.0", "scikit-learn==1.9.1", "scipy==1.17.1", "matplotlib==3.10.8", "joblib==1.6.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3", "httpx==0.28.1"]

notebook = ["ipykernel==7.4.0", "nbformat==5.11.1", "nbclient==0.11.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
